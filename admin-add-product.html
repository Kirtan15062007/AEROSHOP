<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroShop Admin | Add / Edit Product</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>AeroShop</h2>
        <small>Admin Panel</small>
        <a href="admin-dashboard.html">📊 Dashboard</a><a href="admin-products.html">📦 Products</a><a href="admin-add-product.html" class="active">➕ Add Product</a><a href="admin-orders.html">🧾 Orders</a><a href="admin-users.html">👥 Users</a>
        <a href="admin-login.html">🚪 Logout</a>
    </div>

    <!-- Main content -->
    <div class="main">
        <div class="topbar">
            <h1>Add / Edit Product</h1>
            <div class="who">Welcome, <b>Admin</b></div>
        </div>

        <div class="panel">
            <form id="productForm">
                <div class="form-grid">
                    <div><label>Product Name</label><input type="text" placeholder="e.g. Nike Sneakers" required></div>
                    <div>
                        <label>Category</label>
                        <select required>
                            <option value="">Select category</option><option>Clothes</option><option>Electronics</option>
                            <option>Shoes</option><option>Watches</option><option>Skin Care</option>
                        </select>
                    </div>
                    <div><label>Price (₹)</label><input type="number" placeholder="4999" required></div>
                    <div><label>Stock Quantity</label><input type="number" placeholder="50" required></div>
                    <div><label>Brand</label><input type="text" placeholder="e.g. Nike"></div>
                    <div><label>Product Image</label><input type="file" accept="image/*"></div>
                    <div class="full"><label>Description</label><textarea placeholder="Write product details..."></textarea></div>
                    <div class="full"><label>Features (one per line)</label><textarea placeholder="Breathable fabric&#10;Cushioned sole"></textarea></div>
                </div>
                <br>
                <button type="submit" class="btn">Save Product</button>
                <a href="admin-products.html" class="btn danger">Cancel</a>
                <p class="msg" id="msg">✔ Product Saved Successfully!</p>
            </form>
        </div>
    </div>

    <script>
        // Show a success message when the form is submitted
        document.getElementById("productForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const m = document.getElementById("msg");
            m.style.display = "block";
            setTimeout(() => m.style.display = "none", 2500);
        });
    </script>
</body>

</html>
