<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroShop | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>AeroShop</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html" id="authLink">Login</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Login</h1>
        <p>Access your AeroShop account</p>
    </section>

    <div class="container">
        <div class="login-card">

            <div class="tabs">
                <button type="button" id="tabLogin" class="active">Login</button>
                <button type="button" id="tabRegister">Sign Up</button>
            </div>

            <!-- Login form -->
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email Address" required>
                <input type="password" id="loginPass" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <!-- Sign up form -->
            <form id="registerForm" style="display:none;">
                <input type="text" id="regName" placeholder="Full Name" required>
                <input type="email" id="regEmail" placeholder="Email Address" required>
                <input type="password" id="regPass" placeholder="Password (min 6 characters)" minlength="6" required>
                <button type="submit">Create Account</button>
            </form>

            <p id="formMsg" class="form-msg"></p>
        </div>
    </div>

    <footer>
        <h3>AeroShop</h3>
        <p>Fashion • Electronics • Shoes • Watches • Skin Care</p>
        <p>© 2026 AeroShop. All Rights Reserved.</p>
    </footer>

    <script src="auth.js"></script>
    <script>
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const msg = document.getElementById("formMsg");
        const tabLogin = document.getElementById("tabLogin");
        const tabRegister = document.getElementById("tabRegister");

        function showMsg(text, ok) {
            msg.textContent = text;
            msg.className = "form-msg " + (ok ? "ok" : "err");
        }

        function switchTab(toLogin) {
            loginForm.style.display = toLogin ? "block" : "none";
            registerForm.style.display = toLogin ? "none" : "block";
            tabLogin.classList.toggle("active", toLogin);
            tabRegister.classList.toggle("active", !toLogin);
            msg.className = "form-msg";
        }
        tabLogin.onclick = () => switchTab(true);
        tabRegister.onclick = () => switchTab(false);

        // Already logged in? go home
        if (currentUser()) afterLoginRedirect();

        loginForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const r = loginUser(document.getElementById("loginEmail").value, document.getElementById("loginPass").value);
            showMsg((r.ok ? "✅ " : "❌ ") + r.msg, r.ok);
            if (r.ok) setTimeout(afterLoginRedirect, 1000);
        });

        registerForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const r = registerUser(document.getElementById("regName").value,
                                   document.getElementById("regEmail").value,
                                   document.getElementById("regPass").value);
            showMsg((r.ok ? "✅ " : "❌ ") + r.msg, r.ok);
            if (r.ok) { registerForm.reset(); switchTab(true); showMsg("✅ " + r.msg, true); }
        });
    </script>

</body>

</html>
